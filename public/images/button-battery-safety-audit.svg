<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Button battery home audit</title><desc id="desc">A five-step chart for finding, securing, and monitoring button battery hazards.</desc><rect width="1200" height="760" fill="#eef6ed"/><circle cx="1000" cy="130" r="170" fill="#c9eadf"/><text x="80" y="105" font-family="Arial" font-size="28" font-weight="700" fill="#0e7a5f">SAFERKIDS FIELD GUIDE</text><text x="80" y="175" font-family="Arial" font-size="54" font-weight="800" fill="#18211f">Button Battery Home Audit</text><text x="80" y="225" font-family="Arial" font-size="25" fill="#40514b">Find the battery before a child does.</text><g font-family="Arial" font-size="22" font-weight="700"><rect x="80" y="300" width="190" height="190" rx="22" fill="#0e7a5f"/><text x="175" y="370" text-anchor="middle" fill="white">1. FIND</text><text x="175" y="410" text-anchor="middle" fill="white">remotes, toys,</text><text x="175" y="443" text-anchor="middle" fill="white">cards, lights</text><rect x="292" y="300" width="190" height="190" rx="22" fill="#248f72"/><text x="387" y="370" text-anchor="middle" fill="white">2. TEST</text><text x="387" y="410" text-anchor="middle" fill="white">tool-required</text><text x="387" y="443" text-anchor="middle" fill="white">closure</text><rect x="504" y="300" width="190" height="190" rx="22" fill="#3da689"/><text x="599" y="370" text-anchor="middle" fill="white">3. STORE</text><text x="599" y="410" text-anchor="middle" fill="white">locked, high,</text><text x="599" y="443" text-anchor="middle" fill="white">original pack</text><rect x="716" y="300" width="190" height="190" rx="22" fill="#58b99f"/><text x="811" y="370" text-anchor="middle" fill="#18211f">4. COUNT</text><text x="811" y="410" text-anchor="middle" fill="#18211f">new + used</text><text x="811" y="443" text-anchor="middle" fill="#18211f">batteries</text><rect x="928" y="300" width="190" height="190" rx="22" fill="#7acbb5"/><text x="1023" y="370" text-anchor="middle" fill="#18211f">5. RECHECK</text><text x="1023" y="410" text-anchor="middle" fill="#18211f">monthly + after</text><text x="1023" y="443" text-anchor="middle" fill="#18211f">battery changes</text></g><path d="M175 545h848" stroke="#0e7a5f" stroke-width="8"/><text x="80" y="625" font-family="Arial" font-size="27" font-weight="700" fill="#18211f">Suspected swallowing or insertion is an emergency: act immediately.</text><text x="80" y="675" font-family="Arial" font-size="22" fill="#40514b">Educational guide • Check official CPSC guidance and the product manual</text></svg>
