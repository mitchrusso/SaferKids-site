<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Make recall notices reachable</title><desc id="desc">Original illustration of a baby-gear identification tag, registration envelope, and saved confirmation, connected in reading order.</desc><rect width="1200" height="760" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="65" y="95" font-size="36" fill="#20394a">Make recall notices reachable</text><text x="67" y="144" font-size="20" fill="#20394a">SaferKids • Original editorial illustration</text><rect x="80" y="225" width="310" height="330" rx="12" fill="#d6e9e7"/><circle cx="235" cy="255" r="15" fill="#fff"/><text x="125" y="320" font-size="29" fill="#20394a">MODEL + DATE</text><rect x="120" y="350" width="220" height="13" rx="12" fill="#215e66"/><rect x="120" y="382" width="170" height="13" rx="12" fill="#215e66"/><rect x="120" y="414" width="210" height="13" rx="12" fill="#215e66"/><text x="121" y="491" font-size="23" fill="#20394a">Keep the label</text><path d="M410 390 H478 M456 367 L480 390 L456 413" fill="none" stroke="#20394a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="290" width="280" height="195" rx="12" fill="#fff0c9"/><path d="M500 295 L640 399 L780 295" fill="none" stroke="#b18a39" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="535" font-size="24" fill="#20394a">Register directly</text><path d="M800 390 H860 M839 369 L862 390 L839 413" fill="none" stroke="#20394a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="882" y="220" width="232" height="345" rx="12" fill="#215e66"/><rect x="900" y="250" width="196" height="266" rx="12" fill="#fff"/><circle cx="999" cy="349" r="51" fill="#d6e9e7"/><path d="M971 347 L991 370 L1031 326" fill="none" stroke="#215e66" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="918" y="438" font-size="23" fill="#20394a">Confirmation</text><text x="148" y="651" font-size="30" fill="#20394a">Registration helps contact you. Keep checking recalls.</text></g></svg>
